name: JetBrains plugin release

on:
  push:
    tags:
      - "jetbrains-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example jetbrains-v0.1.0
        required: true
        type: string
      publish_marketplace:
        description: Sign and publish to JetBrains Marketplace
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  runtime:
    name: Runtime ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: win32-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor-runtime/package-lock.json
      - name: Install core dependencies
        run: npm ci
      - name: Install runtime dependencies
        run: npm ci
        working-directory: editor-runtime
      - name: Build, inject, sign, and smoke-test runtime
        run: node editor-runtime/scripts/build-runtime.mjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: gitvaulty-editor-runtime-${{ matrix.target }}
          path: editor-runtime/dist/gitvaulty-editor-runtime-*.zip
          if-no-files-found: error

  plugin:
    name: Package JetBrains plugin
    needs: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: gitvaulty-editor-runtime-*
          path: release-assets
          merge-multiple: true
      - name: Verify release versions
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^jetbrains-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="${RELEASE_TAG#jetbrains-v}"
          plugin_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' jetbrains/build.gradle.kts)"
          runtime_version="$(node --input-type=module -e "import { RUNTIME_VERSION } from './editor-runtime/scripts/package-tools.mjs'; process.stdout.write(RUNTIME_VERSION)")"
          test "$plugin_version" = "$expected"
          test "$runtime_version" = "$expected"
          test "$(find release-assets -maxdepth 1 -name 'gitvaulty-editor-runtime-*.zip' | wc -l | tr -d ' ')" = 5
      - name: Create verified runtime manifest
        run: >-
          node editor-runtime/scripts/create-manifest.mjs
          --assets release-assets
          --output release-assets/gitvaulty-runtime-manifest.json
          --tag "$RELEASE_TAG"
          --repository "https://github.com/${GITHUB_REPOSITORY}"
      - name: Test and package plugin with release manifest
        run: >-
          ./jetbrains/gradlew -p jetbrains
          test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure
          -PgitvaultyRuntimeManifest=${{ github.workspace }}/release-assets/gitvaulty-runtime-manifest.json
          --console=plain
      - name: Stage plugin release files
        shell: bash
        run: |
          mkdir packaged
          cp jetbrains/build/distributions/*.zip packaged/
          cp release-assets/gitvaulty-runtime-manifest.json packaged/
      - uses: actions/upload-artifact@v6
        with:
          name: gitvaulty-jetbrains-plugin
          path: packaged/*
          if-no-files-found: error

  signed-plugin:
    name: Sign JetBrains plugin
    needs: plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v6
        with:
          name: gitvaulty-jetbrains-plugin
          path: packaged
      - name: Build GitVaulty secret runner
        run: npm ci && npm run build
      - name: Require GitVaulty CI identity
        shell: bash
        env:
          GITVAULTY_KEY: ${{ secrets.GITVAULTY_KEY }}
        run: test -n "$GITVAULTY_KEY"
      - name: Sign and verify plugin
        env:
          GITVAULTY_KEY: ${{ secrets.GITVAULTY_KEY }}
        run: >-
          node dist/cli.js run
          -f .github/jetbrains-release-secrets/certificate-chain.pem
          -f .github/jetbrains-release-secrets/private-key.pem
          -f .github/jetbrains-release-secrets/private-key-password.txt
          -- node scripts/run-jetbrains-release.mjs sign
          packaged/gitvaulty-runtime-manifest.json
      - name: Stage signed release files
        shell: bash
        run: |
          mkdir signed
          signed_packages=(jetbrains/build/distributions/*-signed.zip)
          test "${#signed_packages[@]}" = 1
          cp "${signed_packages[0]}" signed/
          cp packaged/gitvaulty-runtime-manifest.json signed/
      - uses: actions/upload-artifact@v6
        with:
          name: gitvaulty-jetbrains-signed
          path: signed/*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release draft
    needs: signed-plugin
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: gitvaulty-editor-runtime-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: gitvaulty-jetbrains-signed
          path: release-assets
      - name: Create draft with release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.zip' -o -name 'gitvaulty-runtime-manifest.json' \) -print | sort)
          test "${#assets[@]}" = 7
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY" \
              --title "GitVaulty for JetBrains ${RELEASE_TAG#jetbrains-v}" \
              --notes "Adds native editing for authorized GitVaulty files across compatible JetBrains IDEs. Saves reuse GitVaulty's verified encryption and atomic replacement, stale ciphertext is protected by fingerprints, and the plugin downloads only digest-verified native runtimes for macOS, Linux, and Windows."

  marketplace:
    name: Publish to JetBrains Marketplace
    if: github.event_name == 'workflow_dispatch' && inputs.publish_marketplace
    needs: signed-plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v6
        with:
          name: gitvaulty-jetbrains-signed
          path: packaged
      - name: Build GitVaulty secret runner
        run: npm ci && npm run build
      - name: Require GitVaulty CI identity
        shell: bash
        env:
          GITVAULTY_KEY: ${{ secrets.GITVAULTY_KEY }}
        run: test -n "$GITVAULTY_KEY"
      - name: Sign and publish plugin
        env:
          GITVAULTY_KEY: ${{ secrets.GITVAULTY_KEY }}
        run: >-
          node dist/cli.js run
          -f .github/jetbrains-release-secrets/certificate-chain.pem
          -f .github/jetbrains-release-secrets/private-key.pem
          -f .github/jetbrains-release-secrets/private-key-password.txt
          -f .github/jetbrains-release-secrets/publish-token.txt
          -- node scripts/run-jetbrains-release.mjs publish
          packaged/gitvaulty-runtime-manifest.json
