name: VS Code extension release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v3.0.1
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: win32-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      - name: Install core dependencies
        run: npm ci
      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode
      - name: Verify extension
        if: runner.os != 'Linux'
        run: npm run check
        working-directory: vscode
      - name: Verify extension on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check
        working-directory: vscode
      - name: Verify tag version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="${RELEASE_TAG#v}"
          core_version="$(node -p "require('./package.json').version")"
          extension_version="$(node -p "require('./vscode/package.json').version")"
          test "$core_version" = "$expected"
          test "$extension_version" = "$expected"
      - name: Package VSIX
        run: |
          npm run stage:sops -- ${{ matrix.target }}
          npm run package -- --target ${{ matrix.target }} --out gitvaulty-${{ matrix.target }}.vsix
        working-directory: vscode
      - uses: actions/upload-artifact@v6
        with:
          name: gitvaulty-${{ matrix.target }}
          path: vscode/gitvaulty-${{ matrix.target }}.vsix
          if-no-files-found: error

  publish:
    name: Publish to Visual Studio Marketplace
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          pattern: gitvaulty-*
          path: vscode/vsix
          merge-multiple: true
      - name: Install publisher tooling
        run: npm ci
        working-directory: vscode
      - name: Publish platform packages
        shell: bash
        working-directory: vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT"
          shopt -s nullglob
          packages=(vsix/*.vsix)
          test "${#packages[@]}" -eq 5
          for package in "${packages[@]}"; do
            npx vsce publish --packagePath "$package"
          done
