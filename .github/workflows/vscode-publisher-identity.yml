name: VS Code publisher identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Marketplace publisher identity
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Sign in with the Marketplace publishing identity
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve Marketplace profile
        shell: bash
        run: |
          profile_id="$(az rest \
            --method get \
            --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1-preview.3' \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv)"
          test -n "$profile_id"
          echo "::notice title=Marketplace publisher identity::$profile_id"
