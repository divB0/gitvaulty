name: Publish to npm

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag, for example v3.0.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v3.0.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./package.json').version")" = "${RELEASE_TAG#v}"
      - run: npm publish
